<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf6f1;
    --ink:#332a3d;
    --muted:#96899d;
    --line:#e6dbe6;
    --rose:#dd8fb6;
    --rose-deep:#bd5686;
    --lilac:#b9a2df;
    --lilac-deep:#7f5cae;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#ddd0dd;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  #phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--cream);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  #screen{
    flex:1;
    overflow-y:auto;
    padding-bottom:100px;
    -webkit-overflow-scrolling:touch;
  }
  #screen::-webkit-scrollbar{display:none;}

  h1,h2,h3{
    font-family:'Fraunces', serif;
    margin:0;
    font-weight:500;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  p{margin:0;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  select,textarea,input{font-family:inherit;}

  .num{ font-family:'Fraunces', serif; font-variant-numeric:tabular-nums; }

  /* ---------- SPLASH ---------- */
  #splash{
    position:fixed; inset:0; z-index:50;
    background:var(--cream);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    max-width:430px; margin:0 auto;
    transition:opacity .6s ease, visibility .6s ease;
  }
  #splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .splash-mark{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:110px;
    line-height:1;
    background:linear-gradient(100deg, var(--rose-deep), var(--lilac-deep));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    transform:translateY(14px);
    animation:riseIn .9s cubic-bezier(.2,.8,.2,1) .2s forwards;
  }
  .splash-sub{
    margin-top:10px;
    font-size:13px;
    letter-spacing:.06em;
    color:var(--muted);
    opacity:0;
    animation:riseIn .9s ease .55s forwards;
  }
  .splash-tap{
    position:absolute; bottom:52px;
    font-size:12px; opacity:0;
    color:var(--muted);
    animation:riseIn .9s ease 1.4s forwards;
  }
  @keyframes riseIn{ to{opacity:1; transform:translateY(0);} }

  /* ---------- TOP BAR ---------- */
  .topbar{
    padding:26px 24px 6px;
  }
  .topbar .eyebrow{font-size:12px; color:var(--muted); letter-spacing:.04em; margin-bottom:4px;}
  .topbar h2{font-size:32px;}
  .topbar-row{display:flex; align-items:center; gap:14px;}
  .back-btn{
    font-size:22px; color:var(--ink); flex-shrink:0; line-height:1; font-family:'Fraunces',serif;
  }

  /* ---------- HOME ---------- */
  .hero{
    padding:8px 24px 22px;
    border-bottom:1px solid var(--line);
    margin:0 24px 22px;
    padding-left:0; padding-right:0;
  }
  .hero .eyebrow{font-size:12px; color:var(--muted); letter-spacing:.04em;}
  .hero .big-pct{
    font-size:96px; line-height:1; font-weight:400; margin-top:4px;
    background:linear-gradient(100deg, var(--rose-deep), var(--lilac-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    display:inline-block;
  }
  .hero .big-pct sup{font-size:34px; top:-46px;}
  .hero .sub-line{font-size:13.5px; color:var(--muted); margin-top:6px;}
  .hero .mini-stats{display:flex; gap:22px; margin-top:16px;}
  .hero .mini-stats div{font-size:12.5px; color:var(--muted);}
  .hero .mini-stats b{font-family:'Fraunces',serif; color:var(--ink); font-weight:600; font-size:15px; margin-right:4px;}

  .section-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin:26px 24px 12px;
  }
  .section-head h3{font-size:19px; font-style:italic; font-weight:500;}
  .section-head .see-all{font-size:12.5px; color:var(--rose-deep); letter-spacing:.02em;}

  .empty-state{
    margin:8px 24px; padding:30px 4px;
    border-top:1px solid var(--line);
    text-align:left;
  }
  .empty-state p{font-size:14px; color:var(--muted); margin-bottom:14px; max-width:280px; line-height:1.6;}
  .btn-primary{
    display:inline-block; color:var(--ink);
    padding:0 0 3px; font-size:14.5px; font-weight:600;
    border-bottom:1.5px solid var(--rose-deep);
  }

  /* leader-dot list rows */
  .leader-list{margin:0 24px; display:flex; flex-direction:column;}
  .leader-row{
    display:flex; align-items:baseline; gap:8px;
    padding:15px 0; border-bottom:1px solid var(--line);
  }
  .leader-row:first-child{border-top:1px solid var(--line);}
  .leader-row .title{
    font-family:'Fraunces', serif; font-size:16.5px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:56%;
  }
  .leader-row .title.done-title{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line); text-decoration-thickness:1.5px;}
  .leader-row .dots{
    flex:1; border-bottom:2px dotted var(--line); position:relative; top:-5px; min-width:14px;
  }
  .leader-row .value{
    flex-shrink:0; font-size:18px; font-weight:500; min-width:38px; text-align:right;
    color:var(--rose-deep);
  }
  .leader-row .value.done{color:var(--lilac-deep);}
  .leader-row .meta-line{width:100%; display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .leader-row .caption{font-size:11.5px; color:var(--muted); margin-top:3px; letter-spacing:.01em;}

  /* ---------- GOALS LIST ---------- */
  .fab{
    position:fixed; max-width:430px; margin:0 auto; left:0; right:0;
    bottom:100px; width:430px; display:flex; justify-content:flex-end; pointer-events:none;
  }
  .fab button{
    pointer-events:auto; margin-inline-end:24px;
    width:54px; height:54px; border-radius:50%;
    background:var(--ink); color:var(--cream); font-size:26px; font-family:'Fraunces',serif;
    display:flex; align-items:center; justify-content:center; padding-bottom:3px;
  }

  /* ---------- FORMS ---------- */
  .form-wrap{padding:6px 24px 0;}
  label.field-label{display:block; font-size:12px; color:var(--muted); letter-spacing:.03em; margin:22px 0 9px;}
  textarea, input[type=text], input[type=datetime-local]{
    width:100%; border:none; border-bottom:1.5px solid var(--line); border-radius:0;
    padding:8px 0; font-family:'Fraunces',serif; font-size:19px; background:transparent;
    color:var(--ink);
  }
  textarea{min-height:70px; resize:vertical; line-height:1.5;}
  textarea::placeholder, input::placeholder{color:var(--muted); font-family:'Inter',sans-serif; font-size:14.5px;}
  textarea:focus, input:focus{outline:none; border-bottom-color:var(--rose-deep);}

  .chip-row{display:flex; flex-wrap:wrap; gap:8px 10px;}
  .chip{
    padding:8px 4px; font-size:14px; color:var(--muted); border-bottom:1.5px solid transparent;
  }
  .chip.active{color:var(--ink); border-bottom-color:var(--rose-deep); font-weight:600;}
  .chip:after{content:''; }
  .chip:not(:last-child):after{content:''; }

  .seg-row{display:flex; gap:0; border-bottom:1.5px solid var(--line);}
  .seg{
    flex:1; text-align:center; padding:10px 6px; font-size:13.5px; color:var(--muted); position:relative;
  }
  .seg.active-high{color:var(--rose-deep); font-weight:600;}
  .seg.active-medium{color:var(--lilac-deep); font-weight:600;}
  .seg.active-low{color:var(--ink); font-weight:600;}
  .seg.active-high:after, .seg.active-medium:after, .seg.active-low:after{
    content:''; position:absolute; left:20%; right:20%; bottom:-1.5px; height:2px; background:currentColor;
  }
  .save-bar{padding:34px 24px 10px;}
  .save-bar button{width:100%; padding:15px; background:var(--ink); color:var(--cream); font-weight:500; font-size:15px; letter-spacing:.02em;}

  /* ---------- GOAL DETAIL ---------- */
  .detail-hero{ padding:4px 24px 0; }
  .detail-hero .cat-line{font-size:12px; color:var(--muted); letter-spacing:.03em;}
  .detail-hero h2{font-size:27px; margin-top:8px; line-height:1.25;}

  .progress-block{margin:26px 24px 0; padding-bottom:22px; border-bottom:1px solid var(--line);}
  .progress-block .top-line{display:flex; justify-content:space-between; align-items:baseline;}
  .progress-block .pct{font-size:52px; font-weight:400;}
  .progress-block .pct sup{font-size:20px; top:-24px; position:relative; color:var(--muted);}
  .progress-block .status-word{font-size:12.5px; color:var(--muted); letter-spacing:.03em;}
  .prog-slider{width:100%; margin-top:14px; -webkit-appearance:none; appearance:none; height:2px; background:var(--line); outline:none;}
  .prog-slider::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--rose-deep); cursor:pointer; border:3px solid var(--cream); box-shadow:0 0 0 1px var(--rose-deep);}
  .prog-slider::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:var(--rose-deep); cursor:pointer; border:3px solid var(--cream);}
  .prog-slider:disabled{opacity:.5;}

  .journey-block{margin:22px 24px 0;}
  .journey-block h3{font-size:13px; font-style:normal; font-weight:600; letter-spacing:.03em; color:var(--muted); text-transform:none; margin-bottom:12px;}
  .loc-row{display:flex; align-items:baseline; gap:14px;}
  .loc-row input{flex:1;}
  .btn-ghost{
    font-size:12.5px; font-weight:600; color:var(--rose-deep); white-space:nowrap; border-bottom:1.5px solid var(--rose-deep); padding-bottom:2px;
  }
  .media-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
  .media-thumb{
    width:78px; height:78px; overflow:hidden; position:relative;
    background:var(--line);
  }
  .media-thumb img, .media-thumb video{width:100%; height:100%; object-fit:cover;}
  .media-add{
    width:78px; height:78px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--muted); font-family:'Fraunces',serif;
  }
  .complete-bar{margin:30px 24px 10px;}
  .complete-btn{
    width:100%; padding:16px; background:var(--ink); color:var(--cream);
    font-weight:500; font-size:15.5px; letter-spacing:.02em;
  }
  .complete-btn.done{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .talk-link{
    margin:20px 24px 0; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:baseline; font-size:14.5px; font-weight:500; font-family:'Fraunces',serif; font-style:italic;
  }

  /* ---------- AI CHAT ---------- */
  .goal-select-bar{margin:0 24px 8px;}
  .goal-select-bar select{
    width:100%; border:none; border-bottom:1.5px solid var(--line); background:transparent;
    padding:8px 0; font-size:13px; color:var(--muted);
  }
  .chat-scroll{padding:6px 24px 0; display:flex; flex-direction:column; gap:20px;}
  .msg-block{max-width:100%;}
  .msg-block .who{font-size:11px; letter-spacing:.05em; color:var(--muted); margin-bottom:5px;}
  .msg-block.user{text-align:right;}
  .msg-block.user .who{text-align:right;}
  .msg-block.user .body{font-family:'Inter',sans-serif; font-size:14.5px; font-weight:500; color:var(--ink); line-height:1.6;}
  .msg-block.ai .body{font-family:'Fraunces',serif; font-style:italic; font-size:16px; color:var(--ink); line-height:1.65; font-weight:400;}
  .msg-block.ai.loading .body{color:var(--muted);}
  .chat-input-bar{
    position:fixed; bottom:80px; max-width:430px; width:100%; left:0; right:0; margin:0 auto;
    padding:10px 24px; background:var(--cream); border-top:1px solid var(--line);
    display:flex; gap:10px; align-items:flex-end;
  }
  .chat-input-bar textarea{min-height:24px; max-height:80px; flex:1; border-bottom:1.5px solid var(--line); padding:6px 0; font-family:'Inter',sans-serif; font-size:14.5px;}
  .chat-input-bar button{
    font-family:'Fraunces',serif; font-style:italic; font-size:15px; color:var(--rose-deep); font-weight:600; flex-shrink:0; padding-bottom:8px;
  }
  .conv-empty-hero{margin:14px 24px 0; padding:20px 0; border-top:1px solid var(--line);}
  .conv-empty-hero h3{font-size:20px; font-style:italic; font-weight:500;}
  .conv-empty-hero p{font-size:13px;color:var(--muted); margin-top:8px; line-height:1.6;}

  /* ---------- NAV ---------- */
  #nav{
    position:fixed; bottom:0; max-width:430px; width:100%; left:0; right:0; margin:0 auto;
    background:var(--cream); border-top:1px solid var(--line);
    display:flex; z-index:20; padding:0 6px;
  }
  #nav button{
    flex:1; padding:16px 4px 13px; font-size:12px; color:var(--muted); letter-spacing:.02em;
    position:relative; font-weight:500;
  }
  #nav button.active{color:var(--ink); font-weight:600;}
  #nav button.active:after{
    content:''; position:absolute; left:38%; right:38%; bottom:8px; height:2px; background:var(--rose-deep);
  }

  /* ---------- CELEBRATION ---------- */
  #celebrate-layer{position:fixed; inset:0; pointer-events:none; z-index:60; max-width:430px; margin:0 auto; overflow:hidden;}
  .confetti{position:absolute; top:-10px; width:5px; height:14px; opacity:.9;}
  #toast{
    position:fixed; bottom:118px; left:50%; transform:translateX(-50%) translateY(20px);
    max-width:360px; background:var(--ink); color:var(--cream); padding:12px 22px;
    font-size:13px; font-weight:500; opacity:0; transition:.35s ease; z-index:70;
    text-align:center; white-space:nowrap; letter-spacing:.01em;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="phone">
  <div id="splash">
    <div class="splash-mark">Hi</div>
    <div class="splash-sub">This is Mine — let's make it happen</div>
    <div class="splash-tap">Tap anywhere to begin</div>
  </div>

  <div id="screen"></div>

  <div class="fab" id="fab" style="display:none;">
    <button onclick="goTo('addGoal')">+</button>
  </div>

  <div id="nav" style="display:none;">
    <button data-tab="home" onclick="goTo('home')">Home</button>
    <button data-tab="goals" onclick="goTo('goals')">Goals</button>
    <button data-tab="ai" onclick="goTo('ai')">Think</button>
    <button data-tab="conversations" onclick="goTo('conversations')">Chats</button>
  </div>

  <div id="celebrate-layer"></div>
  <div id="toast"></div>
</div>

<script>
/* ---------------- STATE ---------------- */
const CATS = [
  {id:'health', label:'Health & Fitness'},
  {id:'learn', label:'Learning'},
  {id:'work', label:'Work'},
  {id:'money', label:'Money'},
  {id:'relations', label:'Relationships'},
  {id:'creative', label:'Personal & Creative'},
];
const PRIORITIES = [
  {id:'high', label:'High'},
  {id:'medium', label:'Medium'},
  {id:'low', label:'Low'},
];

const state = {
  screen: 'home',
  goals: [],
  activeGoalId: null,
  conversations: [],
  activeConversationId: null,
  draft: { title:'', category: CATS[0].id, priority:'medium' },
  chatDraftGoal: '',
};
let uid = 1;
const newId = () => 'id' + (uid++);

/* ---------------- NAV ---------------- */
function goTo(screen, extra){
  state.screen = screen;
  if(extra) Object.assign(state, extra);
  document.getElementById('fab').style.display = (screen==='goals') ? 'flex' : 'none';
  document.getElementById('nav').style.display = ['home','goals','ai','conversations'].includes(screen) ? 'flex' : 'none';
  document.querySelectorAll('#nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === screen);
  });
  render();
  document.getElementById('screen').scrollTop = 0;
}

function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- SPLASH ---------------- */
function dismissSplash(){
  const s = document.getElementById('splash');
  s.classList.add('hide');
  setTimeout(()=>{ s.style.display='none'; goTo('home'); }, 650);
}
document.getElementById('splash').addEventListener('click', dismissSplash);
setTimeout(()=>{ if(state.screen==='home' && !document.getElementById('splash').classList.contains('hide')) dismissSplash(); }, 3600);

/* ---------------- HELPERS ---------------- */
function catOf(id){ return CATS.find(c=>c.id===id) || CATS[0]; }
function priOf(id){ return PRIORITIES.find(p=>p.id===id) || PRIORITIES[1]; }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pctOf(g){ return g.status==='done' ? 100 : (g.progress||0); }
function overallPct(){
  if(state.goals.length===0) return 0;
  const sum = state.goals.reduce((a,g)=>a+pctOf(g),0);
  return Math.round(sum/state.goals.length);
}

/* ---------------- RENDER ROOT ---------------- */
function render(){
  const el = document.getElementById('screen');
  if(state.screen==='home') el.innerHTML = renderHome();
  else if(state.screen==='goals') el.innerHTML = renderGoalsList();
  else if(state.screen==='addGoal') el.innerHTML = renderAddGoal();
  else if(state.screen==='goalDetail') el.innerHTML = renderGoalDetail();
  else if(state.screen==='ai') el.innerHTML = renderAI();
  else if(state.screen==='conversations') el.innerHTML = renderConversations();
  bindScreenEvents();
}

/* ---------------- HOME ---------------- */
function renderHome(){
  const active = state.goals.filter(g=>g.status!=='done');
  const done = state.goals.filter(g=>g.status==='done');
  const dateStr = new Date().toLocaleDateString('en-US', {weekday:'long', day:'numeric', month:'long'});

  let html = `
  <div class="topbar">
    <div class="eyebrow">${dateStr}</div>
    <h2>Overview</h2>
  </div>
  <div class="hero">
    <div class="eyebrow">Overall progress</div>
    <div class="big-pct num">${overallPct()}<sup>%</sup></div>
    <div class="sub-line">across everything you're working on</div>
    <div class="mini-stats">
      <div><b class="num">${active.length}</b>active</div>
      <div><b class="num">${done.length}</b>completed</div>
    </div>
  </div>`;

  html += `<div class="section-head"><h3>Your path</h3><span class="see-all" onclick="goTo('goals')">See all</span></div>`;

  if(state.goals.length===0){
    html += `<div class="empty-state">
      <p>You haven't set a goal yet. Start with your first one and let Mine walk with you, step by step.</p>
      <button class="btn-primary" onclick="goTo('addGoal')">Add your first goal</button>
    </div>`;
  } else {
    const shown = active.slice(-6).reverse();
    html += `<div class="leader-list">`;
    shown.forEach(g=>{
      html += goalLeaderRow(g);
    });
    if(shown.length===0){
      html += `<div class="empty-state"><p>Everything active is done for now.</p></div>`;
    }
    html += `</div>`;
  }

  if(done.length){
    html += `<div class="section-head"><h3>Completed</h3></div>
    <div class="leader-list">`;
    done.slice().reverse().slice(0,6).forEach(g=>{
      html += goalLeaderRow(g);
    });
    html += `</div>`;
  }

  html += `<div class="talk-link" onclick="goTo('ai')"><span>Have something to think through?</span><span>Talk to Mine</span></div>`;

  return html;
}

function goalLeaderRow(g){
  const p = pctOf(g);
  return `<div class="leader-row" onclick="goTo('goalDetail', {activeGoalId:'${g.id}'})">
    <div class="meta-line">
      <span class="title ${g.status==='done'?'done-title':''}">${esc(g.title)}</span>
      <span class="dots"></span>
      <span class="value ${g.status==='done'?'done':''} num">${p}</span>
    </div>
  </div>`;
}

/* ---------------- GOALS LIST ---------------- */
function renderGoalsList(){
  let html = `<div class="topbar"><h2>Your Goals</h2></div>`;
  if(state.goals.length===0){
    html += `<div class="empty-state">
      <p>No goals yet. Tap the plus below to add your first one.</p>
    </div>`;
    return html;
  }
  html += `<div class="leader-list" style="margin-top:14px;">`;
  state.goals.slice().reverse().forEach(g=>{
    html += `<div class="leader-row" onclick="goTo('goalDetail', {activeGoalId:'${g.id}'})">
      <div style="width:100%;">
        <div class="meta-line">
          <span class="title ${g.status==='done'?'done-title':''}">${esc(g.title)}</span>
          <span class="dots"></span>
          <span class="value ${g.status==='done'?'done':''} num">${pctOf(g)}</span>
        </div>
        <div class="caption">${catOf(g.category).label} · ${priOf(g.priority).label} priority${g.location ? ' · '+esc(g.location) : ''}</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* ---------------- ADD GOAL ---------------- */
function renderAddGoal(){
  state.draft = {title:'', category:CATS[0].id, priority:'medium'};
  return `
  <div class="topbar">
    <div class="topbar-row">
      <button class="back-btn" onclick="goTo('goals')">‹</button>
      <h2>New Goal</h2>
    </div>
  </div>
  <div class="form-wrap">
    <label class="field-label">What's the goal?</label>
    <textarea id="goalTitle" placeholder="Read one book every month..."></textarea>

    <label class="field-label">Category</label>
    <div class="chip-row" id="catRow">
      ${CATS.map(c=>`<button class="chip ${c.id===state.draft.category?'active':''}" data-cat="${c.id}">${c.label}</button>`).join('')}
    </div>

    <label class="field-label">Priority</label>
    <div class="seg-row" id="priRow">
      ${PRIORITIES.map(p=>`<button class="seg ${p.id===state.draft.priority?'active-'+p.id:''}" data-pri="${p.id}">${p.label}</button>`).join('')}
    </div>
  </div>
  <div class="save-bar">
    <button onclick="saveGoal()">Save Goal</button>
  </div>`;
}

function bindScreenEvents(){
  const catRow = document.getElementById('catRow');
  if(catRow){
    catRow.querySelectorAll('.chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.draft.category = btn.dataset.cat;
        catRow.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  }
  const priRow = document.getElementById('priRow');
  if(priRow){
    priRow.querySelectorAll('.seg').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.draft.priority = btn.dataset.pri;
        priRow.querySelectorAll('.seg').forEach(b=>b.className='seg');
        btn.classList.add('active-'+btn.dataset.pri);
      });
    });
  }
  const mediaInput = document.getElementById('mediaInput');
  if(mediaInput){
    mediaInput.addEventListener('change', handleMediaUpload);
  }
  const useLocBtn = document.getElementById('useLocBtn');
  if(useLocBtn){
    useLocBtn.addEventListener('click', useMyLocation);
  }
  const locInput = document.getElementById('locInput');
  if(locInput){
    locInput.addEventListener('input', ()=>{
      getGoal().location = locInput.value;
    });
  }
  const dtInput = document.getElementById('dtInput');
  if(dtInput){
    dtInput.addEventListener('change', ()=>{
      getGoal().datetime = dtInput.value;
    });
  }
  const journalInput = document.getElementById('journalInput');
  if(journalInput){
    journalInput.addEventListener('input', ()=>{
      getGoal().journal = journalInput.value;
    });
  }
  const progSlider = document.getElementById('progSlider');
  if(progSlider){
    progSlider.addEventListener('input', ()=>{
      const g = getGoal();
      g.progress = parseInt(progSlider.value, 10);
      document.getElementById('progPctLabel').textContent = g.progress;
    });
  }
  const goalSelect = document.getElementById('goalSelectForChat');
  if(goalSelect){
    goalSelect.addEventListener('change', ()=>{
      const conv = activeConversation();
      if(conv) conv.goalId = goalSelect.value;
      render();
    });
  }
  const chatBox = document.getElementById('chatTextarea');
  if(chatBox){
    chatBox.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
    });
  }
}

function saveGoal(){
  const title = document.getElementById('goalTitle').value.trim();
  if(!title){ showToast('Write the goal first'); return; }
  const g = {
    id:newId(),
    title,
    category:state.draft.category,
    priority:state.draft.priority,
    status:'active',
    progress:0,
    location:'',
    datetime:'',
    journal:'',
    media:[],
    createdAt:Date.now(),
  };
  state.goals.push(g);
  showToast('Goal saved');
  goTo('goalDetail', {activeGoalId:g.id});
}

/* ---------------- GOAL DETAIL ---------------- */
function getGoal(){ return state.goals.find(g=>g.id===state.activeGoalId); }

function renderGoalDetail(){
  const g = getGoal();
  if(!g) return `<div class="topbar"><div class="topbar-row"><button class="back-btn" onclick="goTo('goals')">‹</button><h2>Not found</h2></div></div>`;
  const c = catOf(g.category);
  const pct = pctOf(g);
  return `
  <div class="topbar">
    <div class="topbar-row">
      <button class="back-btn" onclick="goTo('goals')">‹</button>
      <h2>Goal</h2>
    </div>
  </div>
  <div class="detail-hero">
    <div class="cat-line">${c.label} · ${priOf(g.priority).label} priority</div>
    <h2>${esc(g.title)}</h2>
  </div>

  <div class="progress-block">
    <div class="top-line">
      <div class="pct num">${pct}<sup>%</sup></div>
      <div class="status-word">${g.status==='done' ? 'completed' : 'in progress'}</div>
    </div>
    <input type="range" class="prog-slider" id="progSlider" min="0" max="100" value="${g.progress||0}" ${g.status==='done'?'disabled':''}>
  </div>

  <div class="journey-block">
    <h3>Where &amp; when</h3>
    <div class="loc-row">
      <input type="text" id="locInput" placeholder="Location" value="${esc(g.location||'')}">
      <button class="btn-ghost" id="useLocBtn">Use current</button>
    </div>
    <label class="field-label">Date &amp; time</label>
    <input type="datetime-local" id="dtInput" value="${g.datetime||''}">
  </div>

  <div class="journey-block">
    <h3>Photos &amp; video</h3>
    <div class="media-row" id="mediaRow">
      ${g.media.map((m,i)=>`<div class="media-thumb">${m.type.startsWith('video')?`<video src="${m.url}" muted></video>`:`<img src="${m.url}">`}</div>`).join('')}
      <label class="media-add">+<input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none;"></label>
    </div>
  </div>

  <div class="journey-block">
    <h3>Write your experience</h3>
    <textarea id="journalInput" placeholder="What happened, how did it feel, what did you learn...">${esc(g.journal||'')}</textarea>
  </div>

  <div class="talk-link" onclick="goTo('ai', {chatDraftGoal:g.id, activeConversationId:null})"><span>Talk this goal through</span><span>with Mine</span></div>

  <div class="complete-bar">
    <button class="complete-btn ${g.status==='done'?'done':''}" onclick="toggleComplete()">
      ${g.status==='done' ? 'Completed' : 'Mark as complete'}
    </button>
  </div>`;
}

function handleMediaUpload(e){
  const files = Array.from(e.target.files||[]);
  const g = getGoal();
  let remaining = files.length;
  if(!remaining) return;
  files.forEach(f=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      g.media.push({type:f.type, url:reader.result});
      remaining--;
      if(remaining===0) render();
    };
    reader.readAsDataURL(f);
  });
}

function useMyLocation(){
  if(!navigator.geolocation){ showToast('Your browser does not support location'); return; }
  showToast('Getting your location...');
  navigator.geolocation.getCurrentPosition(pos=>{
    const g = getGoal();
    g.location = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
    render();
  }, err=>{
    showToast("Couldn't get your location — type it manually");
  });
}

function toggleComplete(){
  const g = getGoal();
  if(g.status==='done') return;
  g.status = 'done';
  g.progress = 100;
  g.completedAt = Date.now();
  render();
  fireConfetti();
  showToast('Another one, done.');
}

function fireConfetti(){
  const layer = document.getElementById('celebrate-layer');
  const colors = ['#dd8fb6','#bd5686','#b9a2df','#7f5cae'];
  for(let i=0;i<34;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random()*100+'%';
    el.style.background = colors[i%colors.length];
    el.style.animation = `fall ${1.4+Math.random()*1.1}s ease-in forwards`;
    el.style.animationDelay = (Math.random()*0.3)+'s';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    layer.appendChild(el);
    setTimeout(()=>el.remove(), 3000);
  }
}
const styleSheet = document.createElement('style');
styleSheet.textContent = `@keyframes fall{ to{ transform:translateY(720px) rotate(400deg); opacity:0; } }`;
document.head.appendChild(styleSheet);

/* ---------------- AI CHAT ---------------- */
function activeConversation(){
  return state.conversations.find(c=>c.id===state.activeConversationId);
}

function renderAI(){
  let conv = activeConversation();
  if(!conv){
    conv = {
      id:newId(),
      goalId: state.chatDraftGoal || '',
      title: 'New conversation',
      messages: [],
    };
    state.conversations.push(conv);
    state.activeConversationId = conv.id;
    state.chatDraftGoal = '';
  }

  const goalOptions = `<option value="">No goal linked</option>` +
    state.goals.map(g=>`<option value="${g.id}" ${g.id===conv.goalId?'selected':''}>${esc(g.title)}</option>`).join('');

  let msgsHtml = '';
  if(conv.messages.length===0){
    msgsHtml = `<div class="conv-empty-hero">
      <h3>Tell me what's on your mind.</h3>
      <p>An idea, a goal, stuck on a step? Let's talk it through together.</p>
    </div>`;
  } else {
    conv.messages.forEach(m=>{
      msgsHtml += `<div class="msg-block ${m.role==='user'?'user':'ai'} ${m.loading?'loading':''}">
        <div class="who">${m.role==='user' ? 'YOU' : 'MINE'}</div>
        <div class="body">${esc(m.text)}</div>
      </div>`;
    });
  }

  return `
  <div class="topbar"><h2>Think</h2></div>
  <div class="goal-select-bar">
    <select id="goalSelectForChat">
      ${goalOptions}
    </select>
  </div>
  <div class="chat-scroll" id="chatScroll">${msgsHtml}</div>
  <div style="height:70px;"></div>
  <div class="chat-input-bar">
    <textarea id="chatTextarea" placeholder="Type here..."></textarea>
    <button onclick="sendChat()">Send</button>
  </div>`;
}

async function sendChat(){
  const box = document.getElementById('chatTextarea');
  const text = box.value.trim();
  if(!text) return;
  const conv = activeConversation();
  conv.messages.push({role:'user', text});
  if(conv.title==='New conversation') conv.title = text.slice(0,30);
  box.value='';
  render();
  document.getElementById('chatScroll').scrollTop = 999999;

  const loadingMsg = {role:'ai', text:'Thinking...', loading:true};
  conv.messages.push(loadingMsg);
  render();

  const linkedGoal = state.goals.find(g=>g.id===conv.goalId);
  const goalContext = linkedGoal
    ? `The goal linked to this conversation: "${linkedGoal.title}" (category: ${catOf(linkedGoal.category).label}, priority: ${priOf(linkedGoal.priority).label}, progress: ${pctOf(linkedGoal)}%, status: ${linkedGoal.status==='done'?'completed':'in progress'}).`
    : 'No specific goal is linked — the user is just sharing general ideas.';

  const systemPrompt = `You are "Mine", a thoughtful companion inside a personal goal-tracking app. Speak in warm, plain, encouraging English, concise and practical (no more than two or three short paragraphs, or a quick set of bullet points). Help the user think through realistic, concrete steps toward their goal, ask clarifying questions when useful, and suggest tangible next actions. Skip long intros and don't just repeat what they said. ${goalContext}`;

  try{
    const apiMessages = conv.messages.filter(m=>!m.loading).map(m=>({role:m.role==='user'?'user':'assistant', content:m.text}));
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        system: systemPrompt,
        messages: apiMessages,
      })
    });
    const data = await res.json();
    const reply = (data.content||[]).map(b=>b.text||"").join("\n") || "Sorry, I didn't quite catch that — could you rephrase?";
    conv.messages.pop();
    conv.messages.push({role:'ai', text:reply});
  }catch(err){
    conv.messages.pop();
    conv.messages.push({role:'ai', text:'Something went wrong connecting — try again in a bit.'});
  }
  render();
  const sc = document.getElementById('chatScroll');
  if(sc) sc.scrollTop = 999999;
}

/* ---------------- CONVERSATIONS ---------------- */
function renderConversations(){
  let html = `<div class="topbar"><h2>Conversations</h2></div>`;
  if(state.conversations.filter(c=>c.messages.length).length===0){
    html += `<div class="empty-state">
      <p>You haven't started a conversation with Mine yet. Try sharing an idea or a goal.</p>
      <button class="btn-primary" onclick="goTo('ai')">Start a conversation</button>
    </div>`;
    return html;
  }
  html += `<div class="leader-list" style="margin-top:14px;">`;
  state.conversations.filter(c=>c.messages.length).slice().reverse().forEach(c=>{
    const g = state.goals.find(x=>x.id===c.goalId);
    html += `<div class="leader-row" onclick="goTo('ai', {activeConversationId:'${c.id}'})">
      <div style="width:100%;">
        <div class="meta-line">
          <span class="title">${esc(c.title)}</span>
          <span class="dots"></span>
        </div>
        <div class="caption">${g ? 'Linked to '+esc(g.title) : 'General conversation'}</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* ---------------- INIT ---------------- */
render();
</script>
</body>
</html>
